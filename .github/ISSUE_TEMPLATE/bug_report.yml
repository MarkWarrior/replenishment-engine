name: Bug Report

description: 报告一个 bug

title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug 描述
        请清晰描述问题。

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "版本号"
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "操作系统"
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true