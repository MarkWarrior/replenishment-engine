name: Feature Request

description: 提出新功能建议

title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 功能建议
        请描述你想要的功能以及它能解决什么问题。

  - type: textarea
    id: problem
    attributes:
      label: "解决什么问题"
      placeholder: |
        当前痛点：...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "期望的解决方案"
      placeholder: |
        建议：...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      placeholder: |
        是否有其他解决方案？

  - type: dropdown
    id: priority
    attributes:
      label: "优先级"
      options:
        - 高
        - 中
        - 低